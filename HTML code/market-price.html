<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Price - AgroKuching</title>
    <link rel="stylesheet" href="/CSS code/home-page.css?v=5" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="brand">
            <img src="/pictures/logo.png" alt="Logo" class="brand-logo" />
            <span class="brand-name">AgroKuching</span>
        </div>
        <div class="search-bar-group">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search vegetables..." autocomplete="off" />
            </div>
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="window.location.href='/HTML code/messages.html'" title="Messages">💬</button>
            <div class="profile-menu">
                <button class="profile-btn" id="profileBtn">👤</button>
                <div class="dropdown" id="profileDropdown">
                    <a href="#" id="profileLink">Profile</a>
                    <a href="/HTML code/settings.html">Settings</a>
                    <a href="/HTML code/admin-facebook.html" id="adminLink" style="display:none;">Admin Panel</a>
                    <a href="#" id="logoutLink">Log out</a>
                </div>
            </div>
        </div>
    </header>

    <nav class="sub-nav">
        <a href="/HTML code/home-page.html" class="sub-nav-item">Home</a>
        <a href="/HTML code/market-price.html" class="sub-nav-item active">Market Price</a>
        <a href="/HTML code/about.html" class="sub-nav-item">About Us</a>
        <a href="/HTML code/contact.html" class="sub-nav-item">Contact Us</a>
    </nav>

    <main class="market-main">
        <div class="market-header-section">
            <h1>📊 Kuching Vegetable Market Prices</h1>
            <p class="market-subtitle">Current wholesale & retail prices updated by AgroKuching admins</p>
        </div>

        <div id="marketGrid" class="market-grid">
            <div class="market-loading-msg">Loading prices...</div>
        </div>
    </main>

    <script>
        const TOKEN_KEY = 'authToken';
        const token = () => localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || '';

        // Profile dropdown
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');
        if (profileBtn) {
            profileBtn.addEventListener('click', e => { e.stopPropagation(); profileDropdown.classList.toggle('show'); });
            document.addEventListener('click', () => profileDropdown.classList.remove('show'));
        }

        // Admin link
        if (token()) {
            fetch('/api/admin/check', { headers: { 'Authorization': 'Bearer ' + token() } })
                .then(r => r.json()).then(d => {
                    if (d.is_admin) document.getElementById('adminLink').style.display = 'block';
                }).catch(() => {});
            fetch('/api/profile', { headers: { 'Authorization': 'Bearer ' + token() } })
                .then(r => r.json()).then(d => {
                    if (d.profile_picture) {
                        profileBtn.innerHTML = `<img src="${d.profile_picture}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.parentElement.innerHTML='👤'">`;
                    }
                    const pl = document.getElementById('profileLink');
                    if (pl) pl.addEventListener('click', e => { e.preventDefault(); window.location.href = `/HTML code/profile.html?user=${d.username}`; });
                }).catch(() => {});
        }

        // Logout
        const logoutLink = document.getElementById('logoutLink');
        if (logoutLink) logoutLink.addEventListener('click', e => { e.preventDefault(); localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); window.location.href = '/HTML code/log-in.html'; });

        // Load and render market prices
        async function loadMarketPrices() {
            const grid = document.getElementById('marketGrid');
            try {
                const res = await fetch('/api/market-prices');
                const prices = await res.json();
                if (!prices.length) { grid.innerHTML = '<p style="text-align:center;color:#999;">No prices available.</p>'; return; }

                grid.innerHTML = '';
                prices.forEach(p => {
                    // Generate fake sparkline data (last 7 days trend around current price)
                    const base = parseFloat(p.price_per_kg);
                    const sparkData = Array.from({length: 7}, (_, i) => +(base + (Math.random() - 0.5) * base * 0.15).toFixed(2));
                    sparkData[6] = base; // last point is current price
                    const trend = sparkData[6] >= sparkData[0] ? 'up' : 'down';

                    const card = document.createElement('div');
                    card.className = 'market-card';
                    card.innerHTML = `
                        <div class="market-card-name">${p.name}</div>
                        <canvas class="spark-chart" id="spark-${p.id}" width="120" height="50"></canvas>
                        <div class="market-card-price ${trend}">
                            RM ${base.toFixed(2)}<span class="market-unit">/kg</span>
                            <span class="trend-arrow">${trend === 'up' ? '▲' : '▼'}</span>
                        </div>
                        <div class="market-card-updated">Updated: ${new Date(p.updated_date).toLocaleDateString('en-MY')}</div>
                    `;
                    grid.appendChild(card);

                    // Draw sparkline
                    setTimeout(() => {
                        const ctx = document.getElementById(`spark-${p.id}`);
                        if (!ctx) return;
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: ['6d','5d','4d','3d','2d','1d','Now'],
                                datasets: [{
                                    data: sparkData,
                                    borderColor: trend === 'up' ? '#2d7a2d' : '#e53935',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    fill: true,
                                    backgroundColor: trend === 'up' ? 'rgba(45,122,45,0.08)' : 'rgba(229,57,53,0.08)',
                                    tension: 0.4
                                }]
                            },
                            options: {
                                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                                scales: { x: { display: false }, y: { display: false } },
                                animation: false,
                                responsive: false
                            }
                        });
                    }, 50);
                });
            } catch(e) {
                grid.innerHTML = '<p style="text-align:center;color:red;">Failed to load prices.</p>';
            }
        }

        loadMarketPrices();
    </script>
</body>
</html>
