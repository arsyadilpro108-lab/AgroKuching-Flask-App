<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroKuching</title>
    <link rel="stylesheet" href="/CSS code/home-page.css?v=5" />
</head>
<body>

    <!-- TOP HEADER -->
    <header>
        <div class="brand">
            <img src="/pictures/logo.png" alt="Logo" class="brand-logo" />
            <span class="brand-name">AgroKuching</span>
        </div>

        <!-- Category Filter + Search -->
        <div class="search-bar-group">
            <div class="category-dropdown-wrap">
                <button class="category-btn" id="categoryBtn">All ▾</button>
                <div class="category-dropdown" id="categoryDropdown">
                    <a href="#" data-cat="">All</a>
                    <a href="#" data-cat="Crops">Crops</a>
                    <a href="#" data-cat="Livestock">Livestock</a>
                    <a href="#" data-cat="Equipment">Equipment</a>
                    <a href="#" data-cat="Seeds">Seeds</a>
                    <a href="#" data-cat="Fertilizer">Fertilizer</a>
                    <a href="#" data-cat="Other">Other</a>
                </div>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search posts or users..." autocomplete="off" />
                <button class="clear-search-icon" id="clearSearch" style="display:none;">&times;</button>
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </div>

        <div class="header-right">
            <button class="icon-btn" onclick="window.location.href='/HTML code/messages.html'" title="Messages">
                💬
                <span class="message-badge" id="messageBadge" style="display:none;">0</span>
            </button>
            <div class="profile-menu">
                <button class="profile-btn" id="profileBtn">👤</button>
                <div class="dropdown" id="profileDropdown">
                    <a href="#" id="profileLink">Profile</a>
                    <a href="/HTML code/settings.html">Settings</a>
                    <a href="/HTML code/admin-facebook.html" id="adminLink" style="display:none;">Admin Panel</a>
                    <a href="#" id="logoutLink">Log out</a>
                    <a href="#" id="deleteAccountLink" class="delete-account-link">Delete Account</a>
                </div>
            </div>
        </div>
    </header>

    <!-- SUB NAV -->
    <nav class="sub-nav">
        <a href="/HTML code/home-page.html" class="sub-nav-item active">Home</a>
        <a href="/HTML code/market-price.html" class="sub-nav-item">Market Price</a>
        <a href="/HTML code/about.html" class="sub-nav-item">About Us</a>
        <a href="/HTML code/contact.html" class="sub-nav-item">Contact Us</a>
        <a href="/HTML code/create-post.html" class="sub-nav-item create-post-nav">+ Create Post</a>
    </nav>

    <!-- MAIN CONTENT -->
    <main>
        <div id="postContainer" class="post-grid"></div>
    </main>

    <!-- MODALS -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <span class="close" id="closeEditModal">&times;</span>
            <h2>Edit Post</h2>
            <form id="editForm" autocomplete="off">
                <label>Title</label><input type="text" id="editTitle" required autocomplete="off" />
                <label>Price</label><input type="text" id="editPrice" required autocomplete="off" />
                <label>Description</label><textarea id="editDescription" rows="4" required autocomplete="off"></textarea>
                <label>Contact Info</label><input type="text" id="editContact" required autocomplete="off" />
                <label>Product Images (leave empty to keep current)</label>
                <input type="file" id="editImages" accept="image/*" multiple />
                <div class="preview" id="editImagePreview"></div>
                <button type="submit" class="submit-btn">Update Post</button>
            </form>
        </div>
    </div>

    <div class="modal" id="logoutModal">
        <div class="modal-content">
            <p>Are you sure you want to log out?</p>
            <button id="confirmLogout" class="submit-btn-red">Yes</button>
            <button id="cancelLogout" class="submit-btn">No</button>
        </div>
    </div>

    <div class="modal" id="imageGallery">
        <div class="gallery-content">
            <span class="close" id="closeGallery">&times;</span>
            <button class="gallery-nav prev" id="galleryPrev">&#10094;</button>
            <img id="galleryImage" />
            <button class="gallery-nav next" id="galleryNext">&#10095;</button>
            <div class="gallery-counter" id="galleryCounter">1 / 1</div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        }
    </script>
    <script src="/JS code/home-page.js?v=6"></script>
</body>
</html>
